name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recoverkit
          POSTGRES_PASSWORD: recoverkit
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recoverkit" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsc --noEmit -p apps/web
      - run: npm test -- --coverage
      - run: npm run test:int
      - run: npx vitest run --project ui
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build --workspace @recoverkit/web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        working-directory: apps/web
